<h2>個人資料管理</h2>
<form method="POST">
    帳號：{{ user.username }} (不可修改)<br>
    Email：<input type="email" name="email" value="{{ user.email }}" required><br>
    電話：<input type="text" name="phone" value="{{ user.phone }}"><br>
    出生日期：<input type="date" name="birthday" value="{{ user.birthday }}" required><br>
    新密碼：<input type="password" name="password" placeholder="留空則不修改"><br>
    <button type="submit">更新資料</button>
</form>
<a href="/announcement">回公告頁</a>
