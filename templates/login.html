{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <div class="card-body">
                <h2 class="text-center fw-bold mb-4">🔑 會員登入</h2>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-secondary">Email 地址</label>
                        <input type="email" name="email" class="form-control form-control-lg" placeholder="example@test.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-secondary">密碼</label>
                        <input type="password" name="password" class="form-control form-control-lg" placeholder="請輸入密碼" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-login btn-lg shadow-sm text-white" style="background-color: #555e7b;">
                            登入系統
                        </button>
                    </div>
                </form>
                <div class="text-center mt-4">
                    <p class="text-muted">還沒有帳號？ <a href="/register" class="text-decoration-none" style="color: #4b3891;">立即註冊</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
